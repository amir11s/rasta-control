name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Download Persian font (Vazirmatn)
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/vazir.ttf https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Regular.ttf || rm -f app/src/main/assets/vazir.ttf
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RastaControl-APK
          path: app/build/outputs/apk/debug/app-debug.apk
